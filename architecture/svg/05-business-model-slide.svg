0 0 1 -416.3 436.3 Z" fill="#FFC247"/><path d="M 8 12 L -416.3 436.3 A 600 600 0 0 1 -592.0 12.0 Z" fill="#A6E86F"/><path d="M 8 12 L -592.0 12.0 A 600 600 0 0 1 -416.3 -412.3 Z" fill="#7FB5B9"/><path d="M 8 12 L -416.3 -412.3 A 600 600 0 0 1 8.0 -588.0 Z" fill="#4F6EF7"/></g></g><g transform="translate(50.9,-91.5) scale(1.05)" stroke="#FFFFFF" fill="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-17,-3 L17,-3 L17,25 L-17,25 Z M-11,-3 L-11,-13 C-11,-28 11,-28 11,-13 L11,-3 M0,8 L0,15" fill="none"/><circle cx="0" cy="7" r="3"/></g><g transform="translate(117.0,-33.2) scale(1.05) rotate(40)" stroke="#FFFFFF" fill="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-28 C12,-18 14,0 8,14 L-8,14 C-14,0 -12,-18 0,-28 Z M-8,5 L-18,18 L-8,14 M8,5 L18,18 L8,14 M-4,19 L0,28 L4,19" fill="none"/><circle cx="0" cy="-9" r="4.5" fill="none"/></g><g transform="translate(117.0,57.2) scale(1.05)" stroke="#FFFFFF" fill="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-2,-2 L-2,-26 A24,24 0 1 0 22,-2 Z M5,-9 L5,-30 A21,21 0 0 1 26,-9 Z" fill="none"/></g><g transform="translate(54.7,124.7) scale(1.05)" stroke="#1F2A44" fill="#1F2A44" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-23,-4 A23,23 0 0 1 19,-13 M19,-13 L21,-25 M19,-13 L8,-9 M23,4 A23,23 0 0 1 -19,13 M-19,13 L-21,25 M-19,13 L-8,9" fill="none"/></g><g transform="translate(-31.0,124.0) scale(1.05)" stroke="#1F2A44" fill="#1F2A44" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-25,10 A26,26 0 1 1 25,10 M0,8 L13,-11 M-19,-3 L-15,-1 M0,-19 L0,-14 M19,-3 L15,-1" fill="none"/><circle cx="0" cy="8" r="3.5"/></g><g transform="translate(-95.5,54.9) scale(1.05)" stroke="#1F2A44" fill="#1F2A44" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-10,-13 L11,-13 M-10,-5 L11,-5 M-10,-13 C7,-13 7,4 -10,4 L6,16" fill="none"/><circle cx="0" cy="0" r="27" fill="none"/></g><g transform="translate(-95.5,-30.9) scale(1.05)" stroke="#1F2A44" fill="#1F2A44" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-27 L22,-18 L22,1 C22,15 12,24 0,28 C-12,24 -22,15 -22,1 L-22,-18 Z M-10,0 L-2,9 L12,-7" fill="none"/></g><g transform="translate(-34.9,-91.5) scale(1.05)" stroke="#FFFFFF" fill="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-26,-9 L0,-25 L26,-9 Z M-24,-5 L24,-5 M-17,-1 L-17,17 M-6,-1 L-6,17 M6,-1 L6,17 M17,-1 L17,17 M-27,23 L27,23" fill="none"/></g></g><text x="205" y="222" text-anchor="start" font-family="Montserrat, 'Liberation Sans', Arial, Helvetica, sans-serif" fill="#111111"><tspan font-size="34" font-weight="700">Customers</tspan><tspan x="205" dy="44" font-size="22"><tspan font-weight="700">24.5 billion</tspan><tspan font-weight="400"> UPI payments a month — even</tspan></tspan><tspan x="205" dy="32" font-size="22"><tspan font-weight="700">0.1%</tspan><tspan font-weight="400"> going wrong is </tspan><tspan font-weight="700">24 million</tspan><tspan font-weight="400"> problems.</tspan></tspan><tspan x="205" dy="32" font-size="22"><tspan font-weight="400">For platforms, banks, NBFCs and insurers</tspan></tspan></text><text x="95" y="436" text-anchor="start" font-family="Montserrat, 'Liberation Sans', Arial, Helvetica, sans-serif" fill="#111111"><tspan font-size="34" font-weight="700">Value</tspan><tspan x="95" dy="44" font-size="22"><tspan font-weight="700">~2×</tspan><tspan font-weight="400"> more cases closed with no human:</tspan></tspan><tspan x="95" dy="32" font-size="22"><tspan font-weight="400">safe autonomy from </tspan><tspan font-weight="700">~30%</tspan><tspan font-weight="400"> to </tspan><tspan font-weight="700">55–65%</tspan><tspan font-weight="400">, under</tspan></tspan><tspan x="95" dy="32" font-size="22"><tspan font-weight="400">a guaranteed error ceiling as low as </tspan><tspan font-weight="700">0.2%</tspan></tspan></text><text x="95" y="650" text-anchor="start" font-family="Montserrat, 'Liberation Sans', Arial, Helvetica, sans-serif" fill="#111111"><tspan font-size="34" font-weight="700">Pay-per-Resolution</tspan><tspan x="95" dy="44" font-size="22"><tspan font-weight="700">₹6–12</tspan><tspan font-weight="400"> per ticket resolved on its own,</tspan></tspan><tspan x="95" dy="32" font-size="22"><tspan font-weight="700">₹0</tspan><tspan font-weight="400"> on escalations — paid only when</tspan></tspan><tspan x="95" dy="32" font-size="22"><tspan font-weight="400">we were right to act</tspan></tspan></text><text x="205" y="864" text-anchor="start" font-family="Montserrat, 'Liberation Sans', Arial, Helvetica, sans-serif" fill="#111111"><tspan font-size="34" font-weight="700">Confidence Layer</tspan><tspan x="205" dy="44" font-size="22"><tspan font-weight="400">No rip-and-replace: score, router and Seal</tspan></tspan><tspan x="205" dy="32" font-size="22"><tspan font-weight="400">wrap the existing bot — each decision</tspan></tspan><tspan x="205" dy="32" font-size="22"><tspan font-weight="400">scored in </tspan><tspan font-weight="700">< 200 ms</tspan><tspan font-weight="400">, priced per decision</tspan></tspan></text><text x="1715" y="222" text-anchor="end" font-family="Montserrat, 'Liberation Sans', Arial, Helvetica, sans-serif" fill="#111111"><tspan font-size="34" font-weight="700">On-Prem Licence</tspan><tspan x="1715" dy="44" font-size="22"><tspan font-weight="700">100%</tspan><tspan font-weight="400"> of data stays in-house: annual licence</tspan></tspan><tspan x="1715" dy="32" font-size="22"><tspan font-weight="400">+ tuning retainer for banks and PSPs, from</tspan></tspan><tspan x="1715" dy="32" font-size="22"><tspan font-weight="700">₹6–8</tspan><tspan font-weight="400"> per resolution at </tspan><tspan font-weight="700">100,000+</tspan><tspan font-weight="400"> a month</tspan></tspan></text><text x="1825" y="436" text-anchor="end" font-family="Montserrat, 'Liberation Sans', Arial, Helvetica, sans-serif" fill="#111111"><tspan font-size="34" font-weight="700">Go-to-Market</tspan><tspan x="1825" dy="44" font-size="22"><tspan font-weight="400">Free </tspan><tspan font-weight="700">60-day</tspan><tspan font-weight="400"> pilot on failed-UPI disputes,</tspan></tspan><tspan x="1825" dy="32" font-size="22"><tspan font-weight="400">up to </tspan><tspan font-weight="700">5,000</tspan><tspan font-weight="400"> resolutions — ending in a</tspan></tspan><tspan x="1825" dy="32" font-size="22"><tspan font-weight="400">reliability report no competitor can produce</tspan></tspan></text><text x="1825" y="650" text-anchor="end" font-family="Montserrat, 'Liberation Sans', Arial, Helvetica, sans-serif" fill="#111111"><tspan font-size="34" font-weight="700">Unit Economics</tspan><tspan x="1825" dy="44" font-size="22"><tspan font-weight="700">₹3–6</tspan><tspan font-weight="400"> per resolution vs </tspan><tspan font-weight="700">₹40–60</tspan><tspan font-weight="400"> for a human:</tspan></tspan><tspan x="1825" dy="32" font-size="22"><tspan font-weight="700">85–95%</tspan><tspan font-weight="400"> cheaper, and a first reply in</tspan></tspan><tspan x="1825" dy="32" font-size="22"><tspan font-weight="700">under 5 seconds</tspan><tspan font-weight="400"> instead of hours</tspan></tspan></text><text x="1715" y="864" text-anchor="end" font-family="Montserrat, 'Liberation Sans', Arial, Helvetica, sans-serif" fill="#111111"><tspan font-size="34" font-weight="700">Data Flywheel</tspan><tspan x="1715" dy="44" font-size="22"><tspan font-weight="700">100%</tspan><tspan font-weight="400"> of human decisions become training</tspan></tspan><tspan x="1715" dy="32" font-size="22"><tspan font-weight="400">labels — the curve tightens with every case,</tspan></tspan><tspan x="1715" dy="32" font-size="22"><tspan font-weight="400">so customer </tspan><tspan font-weight="700">#2</tspan><tspan font-weight="400"> costs less than customer </tspan><tspan font-weight="700">#1</tspan></tspan></text></svg>