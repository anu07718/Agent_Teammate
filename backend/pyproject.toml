[project]
name = "nirnaya"
version = "0.1.0"
description = "Nirnaya: the support teammate that knows when to stop"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "pydantic>=2.6",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
monitoring = ["sentry-sdk[fastapi]>=2.0"]
docs = ["pypdf>=4.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
nirnaya = "nirnaya.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nirnaya*"]

[tool.setuptools.package-data]
nirnaya = ["personas/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
